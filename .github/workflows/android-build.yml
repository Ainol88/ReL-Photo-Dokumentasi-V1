
name: Build ReL Photo Dokumentasi V2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
          app/build/outputs/apk/debug/ReL-Photo-Dokumentasi.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReL-Photo-Dokumentasi-V2-APK
          path: app/build/outputs/apk/debug/ReL-Photo-Dokumentasi.apk
