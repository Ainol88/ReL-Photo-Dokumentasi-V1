plugins { id 'com.android.application' }

android {
    namespace 'com.reltv.photodocumentation'
    compileSdk 35
    defaultConfig {
        applicationId 'com.reltv.photodocumentation'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
